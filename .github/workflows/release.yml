name: 发布 AI 探索版
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 1
      DAOZAI_BUILD_LABEL: '${{ github.ref_name }} · AI 探索版'
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: 核对标签版本
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$version") { throw '请从版本标签运行发布，标签必须与 Cargo.toml 一致' }
      - name: 检查与测试
        run: cargo +stable test --locked --all-targets --features record --target x86_64-pc-windows-msvc -- --test-threads=1
      - name: 构建 MSVC 安装版与免安装版
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package.ps1 -NsisCompiler $compiler
      - name: 保存发布文件
        uses: actions/upload-artifact@v4
        with:
          name: daozai-release-${{ github.ref_name }}
          path: |
            dist/Daozai-Setup-*.exe
            dist/Daozai-v*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem ./dist -File | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw '发布文件不完整' }
          gh release create $tag --verify-tag --title "岛仔 AI 探索版 $tag" --notes-file .github/release-notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败' }
